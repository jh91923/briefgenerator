<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Briefgenerator</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#5b6570;--bd:#d4d9df;--ac:#1f5fbf;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1f2328;--tx:#e8eaed;--mu:#9aa4af;--bd:#38404a;--ac:#6ea3f0;--acx:#0d1117}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1f2328;--tx:#e8eaed;--mu:#9aa4af;--bd:#38404a;--ac:#6ea3f0;--acx:#0d1117}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}
.note{color:var(--mu);font-size:.85rem;margin:0 0 12px}
fieldset{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:0 0 14px;padding:12px 14px 14px;min-width:0}
legend{font-weight:600;padding:0 6px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 3px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:.95rem}
label.chk input{width:auto}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
input[type=range]{padding:0;border:0;background:none}
textarea{resize:vertical;min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;width:100%;padding:13px;font-size:1.05rem}
.tabs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
canvas.cv{width:100%;height:auto;border:1px dashed var(--bd);border-radius:8px;touch-action:none;display:block}
#cv{background:#fff;aspect-ratio:5/2}
#crop{cursor:crosshair}
.chk-bg{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px}
#res{max-width:100%;max-height:140px;display:block;border-radius:6px;margin-top:8px}
#msg{min-height:1.4em;margin:8px 0 0;font-size:.9rem;color:var(--mu)}
#pages canvas{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.18);margin:0 0 12px}
.pen{display:grid;grid-template-columns:2fr 1fr;gap:10px}
</style>
</head>
<body>
<main>
<h1>Briefgenerator</h1>
<p class="note">Alle Eingaben bleiben auf Ihrem Gerät: Es werden keine Daten an Server übertragen, gespeichert oder verfolgt. Beim Schließen der Seite sind sie weg.</p>

<fieldset><legend>Absender</legend>
<label for="sName">Name</label><input id="sName" autocomplete="off">
<label for="sStr">Straße und Hausnummer</label><input id="sStr" autocomplete="off">
<div class="row"><div><label for="sPlz">PLZ</label><input id="sPlz" inputmode="numeric" autocomplete="off"></div><div><label for="sOrt">Ort</label><input id="sOrt" autocomplete="off"></div></div>
<div class="row"><div><label for="sTel">Telefon (optional)</label><input id="sTel" autocomplete="off"></div><div><label for="sMail">E-Mail (optional)</label><input id="sMail" autocomplete="off"></div></div>
</fieldset>

<fieldset><legend>Empfänger</legend>
<label for="empf">Anschrift (eine Zeile pro Zeile)</label>
<textarea id="empf" rows="4" placeholder="Firma / Name&#10;Straße Nr.&#10;PLZ Ort"></textarea>
</fieldset>

<fieldset><legend>Brief</legend>
<div class="row"><div><label for="ort">Ort</label><input id="ort" autocomplete="off"></div><div><label for="datum">Datum</label><input id="datum" type="date"></div></div>
<label for="betr">Betreff</label><input id="betr" autocomplete="off">
<label for="anr">Anrede</label><input id="anr" value="Sehr geehrte Damen und Herren," autocomplete="off">
<label for="text">Brieftext</label><textarea id="text" rows="10"></textarea>
<label for="gruss">Grußformel</label><input id="gruss" value="Mit freundlichen Grüßen" autocomplete="off">
</fieldset>

<fieldset><legend>Unterschrift</legend>
<div class="tabs">
<button type="button" id="tDraw" aria-pressed="true">Zeichnen</button>
<button type="button" id="tImg" aria-pressed="false">Bild laden</button>
<button type="button" id="tNone" aria-pressed="false">Keine</button>
</div>
<div id="pDraw"><canvas class="cv" id="cv" width="750" height="300"></canvas>
<div class="pen"><div><label for="pen">Stift</label><select id="pen"><option value="blau">Kugelschreiber blau</option><option value="schwarz">Kugelschreiber schwarz</option><option value="dunkel">Gleichmäßig dunkelblau</option></select></div><div><label for="pw">Stärke</label><input id="pw" type="range" min="2" max="9" step="0.5" value="4.5"></div></div>
<p style="margin:8px 0 0"><button type="button" id="clr">Löschen</button></p></div>
<div id="pImg" hidden>
<input id="file" type="file" accept="image/*">
<div id="cropBox" hidden>
<p class="note" style="margin:10px 0 6px">Zuschneiden: Ziehen Sie auf dem Bild einen Rahmen um die Unterschrift.</p>
<canvas class="cv" id="crop"></canvas>
<p style="margin:8px 0 0"><button type="button" id="cropReset">Auswahl zurücksetzen</button></p>
<label class="chk"><input type="checkbox" id="rmbg"> Hintergrund entfernen (freistellen)</label>
<div id="thrBox" hidden><label for="thr">Schwelle: <span id="thrv">160</span> – höher entfernt mehr Hintergrund</label>
<input id="thr" type="range" min="60" max="240" value="160"></div>
<canvas id="res" class="chk-bg"></canvas>
</div></div>
<div id="sizeBox"><label for="sz">Größe der Unterschrift: <span id="szv">50</span> mm Breite</label>
<input id="sz" type="range" min="10" max="90" step="0.5" value="50">
<label class="chk"><input type="checkbox" id="ov"> Unterschrift ragt leicht über die Grußformel (natürlicherer Look)</label></div>
<label for="uName">Name unter der Unterschrift</label><input id="uName" autocomplete="off">
</fieldset>

<fieldset><legend>Vorschau</legend>
<div id="pages"></div>
</fieldset>

<button class="p" id="go" type="button">Als PDF speichern</button>
<p id="msg" role="status"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
$('datum').value = new Date().toISOString().slice(0,10);
let mode='draw', drawn=false, drawFinal=null, origImg=null, sel=null, imgFinal=null, tm=null;
const sched = () => { clearTimeout(tm); tm = setTimeout(renderPreview, 120); };
document.addEventListener('input', sched);
window.addEventListener('resize', sched);

function setMode(m){
  mode=m;
  [['tDraw','draw'],['tImg','img'],['tNone','none']].forEach(([id,k])=>$(id).setAttribute('aria-pressed',k===m));
  $('pDraw').hidden=m!=='draw'; $('pImg').hidden=m!=='img'; $('sizeBox').hidden=m==='none';
  sched();
}
$('tDraw').onclick=()=>setMode('draw'); $('tImg').onclick=()=>setMode('img'); $('tNone').onclick=()=>setMode('none');
$('sz').addEventListener('input',()=>{$('szv').textContent=$('sz').value;});

// ---- Zeichnen (Kugelschreiber-Look: Strichstärke folgt Tempo/Druck) ----
const cv=$('cv'), ctx=cv.getContext('2d');
const PENS={blau:{c:'#1c3dc4',v:1},schwarz:{c:'#16181b',v:1},dunkel:{c:'#0a1a5c',v:0}};
let strokes=[], cur=null, down=false;
const pt=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height,t:e.timeStamp,p:e.pointerType==='pen'?e.pressure:0};};
function dot(s){ctx.fillStyle=PENS[$('pen').value].c;ctx.beginPath();ctx.arc(s.pts[0].x,s.pts[0].y,+$('pw').value/2,0,7);ctx.fill();}
function seg(s,i){
  const a=s.pts[i-1],b=s.pts[i],pen=PENS[$('pen').value],base=+$('pw').value;
  let w=base;
  if(pen.v){const sp=Math.hypot(b.x-a.x,b.y-a.y)/Math.max(1,b.t-a.t),pr=b.p>0?.6+b.p*.8:1,tg=base*pr*Math.max(.55,1.3-sp*.35);s.w=(s.w===undefined?base:s.w)*.7+tg*.3;w=s.w;}
  ctx.strokeStyle=pen.c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}
function redraw(){ctx.clearRect(0,0,cv.width,cv.height);strokes.forEach(s=>{delete s.w;dot(s);for(let i=1;i<s.pts.length;i++)seg(s,i);});}
cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);cur={pts:[pt(e)]};strokes.push(cur);dot(cur);});
cv.addEventListener('pointermove',e=>{if(!down)return;(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{cur.pts.push(pt(ev));seg(cur,cur.pts.length-1);});});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(!down)return;down=false;updDraw();sched();}));
const restyle=()=>{redraw();updDraw();sched();};
$('pen').onchange=restyle; $('pw').oninput=restyle;
$('clr').onclick=()=>{strokes=[];redraw();updDraw();sched();};
function updDraw(){
  drawFinal=null; if(!strokes.length) return;
  const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0) return;
  const p=6,c=document.createElement('canvas');c.width=x1-x0+2*p;c.height=y1-y0+2*p;
  c.getContext('2d').drawImage(cv,x0-p,y0-p,c.width,c.height,0,0,c.width,c.height);
  drawFinal={src:c.toDataURL('image/png'),w:c.width,h:c.height};
}

// ---- Bild laden, zuschneiden, freistellen ----
const cc=$('crop'), cx=cc.getContext('2d'); let k=1, cdrag=null;
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    origImg=im; sel=null; cc.width=600; cc.height=Math.round(600*im.height/im.width); k=600/im.width;
    $('cropBox').hidden=false; drawCrop(); processImage(); sched();
  };im.src=r.result;};
  r.readAsDataURL(f);
};
function drawCrop(){
  if(!origImg) return;
  cx.clearRect(0,0,cc.width,cc.height); cx.drawImage(origImg,0,0,cc.width,cc.height);
  if(sel){const x=sel.x*k,y=sel.y*k,w=sel.w*k,h=sel.h*k;
    cx.fillStyle='rgba(0,0,0,.55)';
    cx.fillRect(0,0,cc.width,y);cx.fillRect(0,y+h,cc.width,cc.height-y-h);cx.fillRect(0,y,x,h);cx.fillRect(x+w,y,cc.width-x-w,h);
    cx.strokeStyle='#fff';cx.lineWidth=2;cx.strokeRect(x,y,w,h);}
}
const cpos=e=>{const r=cc.getBoundingClientRect();return [Math.max(0,Math.min(cc.width,(e.clientX-r.left)*cc.width/r.width)),Math.max(0,Math.min(cc.height,(e.clientY-r.top)*cc.height/r.height))];};
cc.onpointerdown=e=>{cc.setPointerCapture(e.pointerId);cdrag=cpos(e);};
cc.onpointermove=e=>{if(!cdrag)return;const [x,y]=cpos(e);sel={x:Math.min(cdrag[0],x)/k,y:Math.min(cdrag[1],y)/k,w:Math.abs(x-cdrag[0])/k,h:Math.abs(y-cdrag[1])/k};drawCrop();};
cc.onpointerup=()=>{if(!cdrag)return;cdrag=null;if(sel&&(sel.w*k<8||sel.h*k<8))sel=null;drawCrop();processImage();sched();};
$('cropReset').onclick=()=>{sel=null;drawCrop();processImage();sched();};
$('rmbg').onchange=()=>{$('thrBox').hidden=!$('rmbg').checked;processImage();sched();};
$('thr').oninput=()=>{$('thrv').textContent=$('thr').value;processImage();sched();};
function processImage(){
  if(!origImg){imgFinal=null;return;}
  const s=sel||{x:0,y:0,w:origImg.width,h:origImg.height}, m=Math.min(1,800/Math.max(s.w,s.h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(s.w*m));c.height=Math.max(1,Math.round(s.h*m));
  const g=c.getContext('2d');g.drawImage(origImg,s.x,s.y,s.w,s.h,0,0,c.width,c.height);
  if($('rmbg').checked){
    const id=g.getImageData(0,0,c.width,c.height),d=id.data,t=+$('thr').value,f=50;
    for(let i=0;i<d.length;i+=4){const lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i+3]*=Math.max(0,Math.min(1,(t-lum)/f));}
    g.putImageData(id,0,0);
  }
  imgFinal={src:c.toDataURL('image/png'),w:c.width,h:c.height};
  const r=$('res');r.width=c.width;r.height=c.height;r.getContext('2d').drawImage(c,0,0);
}

// ---- Brief aufbauen (für Vorschau und PDF) ----
const fmtDate=v=>{if(!v)return '';const [y,m,d]=v.split('-');return `${d}.${m}.${y}`;};
function build(){
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const ops=[]; let page=0, cur={st:'normal',sz:11};
  const F=(st,sz)=>{doc.setFont('helvetica',st);doc.setFontSize(sz);cur={st,sz};};
  const T=(s,x,y,al)=>{doc.text(s,x,y,al?{align:al}:undefined);ops.push({k:'t',p:page,s,x,y,al,st:cur.st,sz:cur.sz});};
  const Ln=(x1,y1,x2,y2)=>{doc.line(x1,y1,x2,y2);ops.push({k:'l',p:page,x1,y1,x2,y2});};
  const Im=(src,x,y,w,h)=>{doc.addImage(src,'PNG',x,y,w,h);ops.push({k:'i',p:page,src,x,y,w,h});};
  const NP=()=>{doc.addPage();page++;};
  const L=25,W=165,LH=5.2,MAXY=272, v=id=>$(id).value.trim();
  let y=20;
  F('bold',12); if(v('sName')){T(v('sName'),190,y,'right');y+=5.5;}
  F('normal',10);
  [v('sStr'),[v('sPlz'),v('sOrt')].filter(Boolean).join(' '),v('sTel')&&('Tel.: '+v('sTel')),v('sMail')].filter(Boolean).forEach(l=>{T(l,190,y,'right');y+=4.6;});
  const rs=[v('sName'),v('sStr'),[v('sPlz'),v('sOrt')].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
  F('normal',7); T(rs,L,47); Ln(L,48,L+80,48);
  F('normal',11);
  let ry=54; $('empf').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,7).forEach(l=>{T(l,L,ry);ry+=5;});
  T([v('ort'),fmtDate(v('datum'))].filter(Boolean).join(', '),190,90,'right');
  y=102;
  if(v('betr')){F('bold',11);doc.splitTextToSize(v('betr'),W).forEach(l=>{T(l,L,y);y+=LH;});F('normal',11);y+=4;}
  if(v('anr')){T(v('anr'),L,y);y+=LH*1.6;}
  $('text').value.replace(/\r/g,'').split('\n').forEach(par=>{
    if(!par.trim()){y+=LH*.8;return;}
    doc.splitTextToSize(par,W).forEach(l=>{if(y>MAXY){NP();y=25;}T(l,L,y);y+=LH;});
  });
  const sig=mode==='draw'?drawFinal:mode==='img'?imgFinal:null;
  let sw=0,sh=0;
  if(sig){sw=+$('sz').value;sh=sw*sig.h/sig.w;if(sh>40){sh=40;sw=sh*sig.w/sig.h;}}
  y+=LH; if(y>MAXY-(sig?sh+15:15)){NP();y=25;}
  const ov=sig&&$('ov').checked?Math.min(7,sh*.4):0, gy=y;
  if(v('gruss'))y+=4;
  if(sig){Im(sig.src,L+(ov?2:0),y-ov,sw,sh);y+=sh+2-ov;} else y+=14;
  if(v('gruss'))T(v('gruss'),L,gy);
  if(v('uName')) T(v('uName'),L,y+4);
  return {doc,ops,pages:page+1};
}

// ---- Vorschau ----
const imgCache=new Map();
function getImg(src){let i=imgCache.get(src);if(!i){i=new Image();i.onload=sched;i.src=src;imgCache.set(src,i);}return i;}
function renderPreview(){
  if(!window.jspdf) return;
  const {ops,pages}=build(), box=$('pages'); box.innerHTML='';
  const sc=(box.clientWidth||320)*(window.devicePixelRatio||1)/210;
  for(let p=0;p<pages;p++){
    const c=document.createElement('canvas');c.width=Math.round(210*sc);c.height=Math.round(297*sc);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    g.fillStyle='#000';g.strokeStyle='#000';g.lineWidth=.2*sc;g.textBaseline='alphabetic';
    ops.filter(o=>o.p===p).forEach(o=>{
      if(o.k==='t'){g.font=`${o.st==='bold'?'bold ':''}${o.sz*.3528*sc}px Helvetica,Arial,sans-serif`;g.textAlign=o.al==='right'?'right':'left';g.fillText(o.s,o.x*sc,o.y*sc);}
      else if(o.k==='l'){g.beginPath();g.moveTo(o.x1*sc,o.y1*sc);g.lineTo(o.x2*sc,o.y2*sc);g.stroke();}
      else{const im=getImg(o.src);if(im.complete&&im.naturalWidth)g.drawImage(im,o.x*sc,o.y*sc,o.w*sc,o.h*sc);}
    });
    box.appendChild(c);
  }
}
window.addEventListener('load',()=>{setMode('draw');renderPreview();});

// ---- PDF speichern ----
$('go').onclick=async()=>{
  const msg=$('msg');msg.textContent='';
  if(!window.jspdf){msg.textContent='PDF-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.';return;}
  try{
    const {doc}=build(), name='Brief_'+($('datum').value||'ohne-Datum')+'.pdf';
    let dl=null; try{dl=window.claude&&await window.claude.use('downloads');}catch(e){}
    if(dl) await dl.save({filename:name,data:doc.output('blob')}); else doc.save(name);
    msg.textContent='PDF erstellt.';
  }catch(e){msg.textContent=e&&e.code==='declined'?'Speichern abgebrochen.':'Fehler beim Erstellen des PDFs.';}
};
</script>
</body>
</html>
